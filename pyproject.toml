[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-mlops"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
 "pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2",
 "pandera[pandas]>=0.20,<0.27", "mlflow>=2.12,<4",
 "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1",
 "pydantic>=2.6,<3", "joblib>=1.3,<2", "matplotlib>=3.8,<4",
 "requests>=2.31,<3", "ucimlrepo>=0.0.7", "PyYAML>=6"
]
[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "flake8>=7", "dvc>=3.50"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.black]
line-length = 88
target-version = ["py311"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
